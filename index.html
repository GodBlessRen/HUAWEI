<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="华为 ACM 机考题库浏览器练习台">
  <title>HUAWEI ACM · Web Practice</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">HW</div>
      <div>
        <strong>HUAWEI ACM</strong>
        <span>Browser Practice</span>
      </div>
    </div>
    <div class="top-actions">
      <span id="runtimeBadge" class="runtime-badge">Python 未加载</span>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="切换主题">◐</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div>
          <h1>题库</h1>
          <p id="problemCount">加载中…</p>
        </div>
      </div>
      <label class="search">
        <span>⌕</span>
        <input id="searchInput" placeholder="搜索题号、标题、标签" autocomplete="off">
      </label>
      <div class="filters">
        <select id="difficultyFilter" aria-label="难度筛选">
          <option value="">全部难度</option>
          <option value="1-3">难度 1–3</option>
          <option value="4-6">难度 4–6</option>
          <option value="7-10">难度 7–10</option>
        </select>
        <select id="statusFilter" aria-label="状态筛选">
          <option value="all">全部状态</option>
          <option value="ac">已 AC</option>
          <option value="todo">未完成</option>
        </select>
      </div>
      <div id="problemList" class="problem-list" aria-live="polite"></div>
    </aside>

    <section class="problem-pane">
      <div id="problemHeader" class="problem-header">
        <div>
          <div class="eyebrow">华为校招机考题库</div>
          <h2>选择一道题开始</h2>
          <p>题面、样例和本地 Python 判题都在浏览器里完成。</p>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="statement" type="button">题目</button>
        <button class="tab" data-tab="solution" type="button">参考题解</button>
      </div>
      <article id="contentPanel" class="content-panel empty-panel">
        <div class="empty-hero">
          <strong>从左侧选题</strong>
          <span>支持搜索、难度筛选、AC 进度和 ACM stdin/stdout 样例判题。</span>
        </div>
      </article>
    </section>

    <section class="code-pane">
      <div class="code-toolbar">
        <div>
          <span class="label">Python 3</span>
          <span id="draftState" class="muted">本地草稿</span>
        </div>
        <div class="code-actions">
          <button id="resetBtn" class="ghost-btn" type="button">重置</button>
          <button id="runBtn" class="run-btn" type="button" disabled>运行样例</button>
        </div>
      </div>
      <textarea id="codeEditor" spellcheck="false" aria-label="Python 代码编辑器"># 选择题目后开始编码
</textarea>
      <section class="judge-panel">
        <div class="judge-head">
          <strong>判题结果</strong>
          <span id="judgeSummary" class="muted">等待运行</span>
        </div>
        <div id="judgeResults" class="judge-results">
          <div class="judge-empty">仅运行公开样例；不是官方隐藏测试。</div>
        </div>
      </section>
    </section>
  </main>

  <footer class="footer">
    <span>Browser-only sample judge · 代码在本地 Web Worker 中运行</span>
    <a href="https://github.com/GodBlessRen/HUAWEI" target="_blank" rel="noreferrer">GitHub</a>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
